[project]
name = "cook-sao-database"
version = "0.1.0"
description = "Build a DuckDB database from the Cook County State's Attorney felony case datasets (intake, initiation, dispositions, sentencing, diversion)"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "requests", "huggingface_hub", "pyyaml", "datapond-build"]

[tool.uv.sources]
datapond-build = { git = "https://github.com/datapond-db/datapond-build", tag = "v0.1.1" }
